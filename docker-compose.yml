services:
  lifenet:
    build: .
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      TRUST_PROXY: ${TRUST_PROXY:-false}
      PORT: 5000
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: "${SMTP_FROM:-LifeNet <noreply@local.lifenet>}"
    ports:
      - "${LIFENET_PORT:-5000}:5000"
    depends_on:
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

